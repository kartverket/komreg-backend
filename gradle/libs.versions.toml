[versions]
flywayVersion = "12.9.0"
junit = "6.1.0"
kotest = "5.9.1"
kotlin = "2.3.21"
kotlinx-datetime = "0.8.0-0.6.x-compat"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-collections = "0.5.0"
ktor = "3.5.0"
logback = "1.5.35"
micrometer-prometheus = "1.17.0"
mockk = "1.14.11"
testcontainers = "2.0.5"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-collections-immutable-jvm = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm", version.ref = "kotlinx-collections" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }

arrow-stack = { module = "io.arrow-kt:arrow-stack", version = "1.2.0" } # Må være på samme versjon som i M22
arrow-core = { module = "io.arrow-kt:arrow-core" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines" }
arrow-fx-stm = { module = "io.arrow-kt:arrow-fx-stm" }

typesafe-config = { module = "com.typesafe:config", version = "1.4.9" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }

kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-extensions-arrow = { module = "io.kotest.extensions:kotest-assertions-arrow", version = "1.4.0" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

assertk = { module = "com.willowtreeapps.assertk:assertk", version = "0.28.1" }

slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.18" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-classic-db = { module = "ch.qos.logback.db:logback-classic-db", version = "1.5.32" }

micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer-prometheus" }

postgresql = { module = "org.postgresql:postgresql", version = "42.7.11" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flywayVersion" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywayVersion" }
hikari = { module = "com.zaxxer:HikariCP", version = "7.1.0" }

testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version = "23.26.2.0.0" }

logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version = "9.0" }

dotenv-kotlin = { module = "io.github.cdimascio:dotenv-kotlin", version = "6.5.1" }

matrikkel-komreg = { module = "no.statkart.matrikkel:matrikkel-komreg", version = "local-2026.06.09-06.13-0c04280" }
