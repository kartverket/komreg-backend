ktor {
    deployment {
        port = @DEFAULT_HTTP_PORT@
        port = ${?APP_PORT}
    }
}

app {
    name = "regulering-api"
    name = ${?APP_NAME}
    log.encode = "json"
    log.encode = ${?APP_LOG_ENCODE}
    db {
        url = ${?APP_DB_URL}
        user = "regulering"
        user = ${?APP_DB_USER}
        schema = ${?app.db.user}
        schema = ${?APP_DB_SCHEMA}
        password = ${app.db.user}
        password = ${?APP_DB_PASSWORD}
    }
    otel {
        metrics.exporter = "none"
        metrics.exporter = ${?OTEL_METRICS_EXPORTER}
        traces.exporter = "none"
        traces.exporter = ${?OTEL_TRACES_EXPORTER}
        logs.exporter = "none"
        logs.exporter = ${?OTEL_LOGS_EXPORTER}
        propagators = "tracecontext,baggage"
        propagators = ${?OTEL_PROPAGATORS}


        exporter.otlp {
            endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
            insecure = true
            insecure = ${?OTEL_EXPORTER_OTLP_INSECURE}
            service.name = ${app.name}
            service.name = ${?OTEL_SERVICE_NAME}
            # TODO: Vet ikke om skip støtter gRPC, men nibas var satt til HTTP,
            #       så gjør det samme her.
            protocol = "http/protobuf"
            protocol = ${?OTEL_EXPORTER_OTLP_PROTOCOL}
        }
    }
}
