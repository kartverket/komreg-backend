# Basic dependabot.yml file configuration for gradle package manager
version: 2
registries:
  maven-matrikkel:
    type: maven-repository
    url: https://maven.pkg.github.com/kartverket/matrikkel
    username: ${{ secrets.GH_USERNAME }}
    password: ${{ secrets.GH_PACKAGES_PAT }}

updates:
  # Enable version updates for gradle
  - package-ecosystem: gradle
    # Look for build.gradle files from the `root` directory
    directory: "/"
    # Check for updates weekly on Monday at 03:02 EU time
    schedule:
      interval: weekly
      day: monday
      time: "03:02"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    registries:
      - maven-matrikkel
    ignore:
      # Arrow må være på samme versjon som i Matrikkelen (p.t. 1.2.0).
      # Ulik versjon gir runtime-feil. Se docs/delte-biblioteker.md.
      - dependency-name: "io.arrow-kt:*"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        # CodeQL feiler ofte ved ny versjon av Kotlin.
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "io.ktor*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:02"
      timezone: "Europe/Oslo"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
      time: "03:02"
      timezone: "Europe/Oslo"
