name: Build image
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  registry: ghcr.io
  image_name: ${{ github.repository }}
  argo_version_file: backend-version

jobs:
  build:
    name: Docker build and push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_url: ${{ steps.setOutput.outputs.image_url }}
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build integrationTest --info
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: server/build/docker
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }},${{ env.registry }}/${{ github.repository }}:latest

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  pharos:
    name: Run Pharos with Required Permissions
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@v0.2.1
        with:
          image_url: ${{ needs.build.outputs.image_url}}

  sts:
    name: Update version in apps-repo
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Octo STS
        uses: octo-sts/action@v1.0.0
        id: octo-sts
        with:
          scope: kartverket/smia-apps
          identity: komreg

  print-token:
    needs: [ build, pharos, sts ]
    runs-on: ubuntu-latest
    steps:
      - name: Print token
        run: echo "The token is ${{ needs.sts.steps.octo-sts.outputs.token }}"

  deploy-argo:
    needs: [ build, pharos, sts ]
    uses: kartverket/smia-apps/.github/workflows/release-app.yml@main
    with:
      application: komreg-backend
      version: ${{ needs.build.outputs.version }}
      deploy_dev: true
      deploy_prod: false
    secrets:
      PAT_TOKEN: ${{ needs.sts.steps.octo-sts.outputs.token }}
