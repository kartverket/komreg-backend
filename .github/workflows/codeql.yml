name: "CodeQL"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1-5'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # 4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # 6.2.0

      - name: Build with Gradle
        run: ./gradlew classes testClasses
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT}}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # 4.37.9
        with:
          category: "/language:${{matrix.language}}"
