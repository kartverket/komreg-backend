name: Build and Deploy
on:
  push:
    branches: [ "*" ]

permissions:
  id-token: write
  contents: "read"

env:
  registry: ghcr.io
  image_name: ${{ github.repository }}

jobs:
  build:
    name: Docker build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_url: ${{ steps.setOutput.outputs.image_url }}
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v3
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.5.1
      - name: Run build with Gradle Wrapper
        run: gradle build

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }},${{ env.registry }}/${{ github.repository }}:latest

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  deploy-dev:
    name: Deploy to dev
    needs: build
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v3.1.3
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: write
    with:
      runner: ubuntu-latest
      environment: dev
      kubernetes_cluster: atkv1-dev
      terraform_option_1: -var-file=variables/dev.tfvars
      terraform_option_2: -var=image=${{ needs.build.outputs.image_url }}
      terraform_init_option_1: -backend-config=backend/dev.gcs.tfbackend
      working_directory: terraform
      auth_project_number: 172982192640
      service_account: komreg-deploy@komreg-dev-8b16.iam.gserviceaccount.com
      project_id: kubernetes-dev-94b9
      deploy_on: ${{ github.ref }}

  deploy-test:
    needs: [ build, deploy-dev ]
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: write
    name: Deploy to test
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v3.1.3
    with:
      runner: ubuntu-latest
      environment: test
      kubernetes_cluster: atkv1-test
      terraform_option_1: -var-file=variables/test.tfvars
      terraform_option_2: -var=image=${{ needs.docker.outputs.image_url }}
      terraform_init_option_1: -backend-config=backend/test.gcs.tfbackend
      working_directory: terraform
      auth_project_number: 203459292792
      service_account: komreg-deploy@komreg-test-a245.iam.gserviceaccount.com
      project_id: kubernetes-test-94f6
      image_url: ${{ needs.docker.outputs.image_url}}

  deploy-prod:
    needs: [ docker, deploy-dev, deploy-test ]
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: write
    name: Deploy to prod
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v3.1.3
    with:
      runner: ubuntu-latest
      environment: prod
      kubernetes_cluster: atkv1-prod
      terraform_option_1: -var-file=variables/prod.tfvars
      terraform_option_2: -var=image=${{ needs.docker.outputs.image_url }}
      terraform_init_option_1: -backend-config=backend/prod.gcs.tfbackend
      working_directory: terraform
      auth_project_number: 42971339890
      service_account: komreg-deploy@komreg-prod-6277.iam.gserviceaccount.com
      project_id: kubernetes-prod-e4a2
      image_url: ${{ needs.docker.outputs.image_url}}
