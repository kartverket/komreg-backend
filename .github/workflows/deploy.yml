name: Deploy branch til DEV eller PROD
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
      deploy_prod:
        description: 'Deploy to production'
        type: boolean
        required: true
        default: false
      deploy_dev:
        description: 'Deploy to development'
        type: boolean
        required: true
        default: true

jobs:
  deploy-argo:
    permissions:
      id-token: write
      contents: read
    uses: kartverket/smia-apps/.github/workflows/release-app-octo-sts.yml@main
    with:
      application: komreg-backend
      version: ${{ inputs.version }}
      deploy_dev: ${{ inputs.deploy_dev }}
      deploy_prod: ${{ inputs.deploy_prod }}
      identity: komreg
      namespace: komreg-main
