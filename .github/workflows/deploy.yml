name: Build and Deploy
on:
  push:
    branches: [ "*" ]

permissions:
  id-token: write
  contents: "read"

env:
  registry: ghcr.io
  image_name: ${{ github.repository }}

jobs:
  build:
    name: Build and test
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-test.yml

  docker:
    name: Build and push docker image
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml

  post-build-attest:
    needs: docker
    name: Authentication and Attestation of Build
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
      security-events: write
      statuses: write
    uses: kartverket/github-workflows/.github/workflows/post-build-attest.yml@v3.1.1
    with:
      auth_project_number: 172982192640
      service_account: komreg-deploy@komreg-dev-8b16.iam.gserviceaccount.com
      image_url: ${{ needs.docker.outputs.image_url }}

  security-scans:
    needs: docker
    name: Security Scans
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
      security-events: write
    uses: kartverket/github-workflows/.github/workflows/run-security-scans.yml@v3.1.1
    with:
      auth_project_number: 172982192640
      service_account: komreg-deploy@komreg-dev-8b16.iam.gserviceaccount.com
      image_url: ${{ needs.docker.outputs.image_url}}

  deploy-dev:
    name: Deploy to dev
    needs: docker
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v3.1.3
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: write
    with:
      runner: ubuntu-latest
      environment: dev
      kubernetes_cluster: atkv1-dev
      terraform_option_1: -var-file=variables/dev.tfvars
      terraform_option_2: -var=image=${{ needs.build.outputs.image_url }}
      terraform_init_option_1: -backend-config=backend/dev.gcs.tfbackend
      working_directory: terraform
      auth_project_number: 172982192640
      service_account: komreg-deploy@komreg-dev-8b16.iam.gserviceaccount.com
      project_id: kubernetes-dev-94b9
      deploy_on: ${{ github.ref }}

  deploy-test:
    needs: [ docker, deploy-dev ]
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: write
    name: Deploy to test
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v3.1.3
    with:
      runner: ubuntu-latest
      environment: test
      kubernetes_cluster: atkv1-test
      terraform_option_1: -var-file=variables/test.tfvars
      terraform_option_2: -var=image=${{ needs.docker.outputs.image_url }}
      terraform_init_option_1: -backend-config=backend/test.gcs.tfbackend
      working_directory: terraform
      auth_project_number: 203459292792
      service_account: komreg-deploy@komreg-test-a245.iam.gserviceaccount.com
      project_id: kubernetes-test-94f6
      image_url: ${{ needs.docker.outputs.image_url}}