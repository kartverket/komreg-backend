name: CD - Build and deploy to dev
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  registry: ghcr.io
  image_name: ${{ github.repository }}
  argo_version_file: backend-version

jobs:
  build:
    name: Docker build and push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_url: ${{ steps.setOutput.outputs.image_url }}
      version: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout project sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build with Gradle
        run: ./gradlew build integrationTest --info
        env:
          GH_PACKAGES_PAT: ${{ secrets.SHARED_PACKAGES_READ_TOKEN }}

      - name: Login to Github Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b #v6.2.0
        with:
          github_token: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf #v7.2.0
        with:
          context: server/build/docker
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }},${{ env.registry }}/${{ github.repository }}:latest

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  pharos:
    name: Run Pharos with Required Permissions
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@599d3fe4af8bae19fbfda831662e90ee1c406ec2 # v0.6.3
        with:
          image_url: ${{ needs.build.outputs.image_url}}
          disable_severity_check: true

  should-deploy-argo:
    uses: kartverket/komreg-backend/.github/workflows/check-is-komreg-running.yml

  deploy-argo:
    if: ${{ needs.should-deploy-argo.output.isRunning == false }}
    needs: [ build, should-deploy-argo ]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    concurrency: smia-deploy
    steps:
      - name: Octo STS
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: kartverket/smia-apps
          identity: komreg

      - name: Checkout the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: kartverket/smia-apps
          ref: main
          token: ${{ steps.octo-sts.outputs.token }}

      - name: Update smia-apps and push
        run: |
          git config --global user.email "smia@kartverket.no"
          git config --global user.name "SMIA CI"
          git pull --ff-only origin main

          IMAGEURL="${{ env.registry}}/${{ env.image_name}}:${{ needs.build.outputs.version }}"

          echo "### Deploying \"$IMAGEURL\"" >> $GITHUB_STEP_SUMMARY
          echo 'Deploy to dev? true' >> $GITHUB_STEP_SUMMARY

          # Write the new version to the dev environment file
          echo "\"$IMAGEURL\"" > "$SMIA_APPS_VERSION_FILE"

          git add "$SMIA_APPS_VERSION_FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Releaser komreg-backend:${{ needs.build.outputs.version }}"
            git push origin HEAD:main
          fi

