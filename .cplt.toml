[deny]
env = [
  "DB_KOMREG_PASSWORD",
  "DB_MATRIKKEL_BACKING_PASSWORD",
  "DB_MATRIKKEL_MOTTAKER1_PASSWORD",
  "DB_MATRIKKEL_MOTTAKER2_PASSWORD",
  "DB_MATRIKKEL_SYSTEM_PASSWORD",
]

[propose]
# ⚠️  grants access to the Docker socket, effectively root on the host
# Suggested by: server
# allow_docker = true  # uncomment after reviewing (from heuristic scan)
# Suggested by: (root), buildSrc, core-api, server, transformation
allow_jvm_attach = true
# Suggested by: server
allow_localhost_any = true
gh_guard = true
git_push_prevention = true

[propose.allow]
ports = [5432]
localhost = [8080]

## Machine-specific — these belong in ~/.config/cplt/config.toml, not here.
## Copy the [section] headers too: keys pasted at the end of that file are
## scoped by whichever header precedes them, which silently drops the grant.
